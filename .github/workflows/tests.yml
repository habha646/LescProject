# Lance les tests automatiquement sur GitHub à chaque push et pull request vers main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le workflow peut seulement lire le code (principe du moindre privilège).
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v
